<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Singapore Red Cross AR Cheatsheet</title>
  <link rel="stylesheet" href="./css/ar.css" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <div id="loading" class="overlay">
    <div class="panel">
      <h1>AR Cheatsheet</h1>
      <p id="statusText">Loading...</p>
      <button id="startButton" hidden>Start Camera</button>
    </div>
  </div>

  <div id="topicBadge" class="topic-badge" hidden></div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker id="marker" type="pattern" url="./assets/marker.patt">
      <a-entity
        id="otter"
        gltf-model="./assets/otter.glb"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.45 0.45 0.45">
      </a-entity>

      <a-plane
        id="bubbleBack"
        position="0 1.15 0"
        rotation="-90 0 0"
        width="2.3"
        height="1.2"
        color="#ffffff"
        opacity="0.95">
      </a-plane>

      <a-text
        id="bubbleTitle"
        position="-1.02 1.14 -0.04"
        rotation="-90 0 0"
        width="2"
        color="#102030"
        value="">
      </a-text>

      <a-text
        id="bubblePoints"
        position="-1.02 1.02 -0.04"
        rotation="-90 0 0"
        width="2"
        color="#102030"
        value="">
      </a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script type="module" src="./js/ar-cheatsheet.js"></script>
</body>
</html>
